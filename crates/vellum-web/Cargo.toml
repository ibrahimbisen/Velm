[package]
name = "vellum-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Velm in a browser tab: WebGPU canvas, board snapshot over HTTP, pan and zoom."

[lib]
crate-type = ["cdylib", "rlib"]

# The whole browser client. It exists so `vellum-app` never grows a `wasm_bindgen`
# attribute: that crate is 60,000 lines with a window, a clipboard, a native menu bar and
# SQLite behind it, and none of that can follow us into a tab.
#
# What it depends on is the argument for the whole approach -- four crates, all of which
# already compiled for wasm32 with no changes at all:
#
#   vellum-doc      the CRDT document, from snapshot bytes
#   vellum-project  document -> scene, extracted from vellum-app for exactly this
#   vellum-scene    the R-tree, the camera, and what is on screen
#   vellum-render   wgpu, asking for zero features and staying inside Limits::default()
#   vellum-text     cosmic-text, with Inter bundled and the system scan a no-op here
#   vellum-ink      Catmull-Rom smoothing and variable-width tessellation -- lyon, pure
#   vellum-connect  routing and arrowheads -- lyon and serde, pure
[dependencies]
vellum-doc.workspace = true
vellum-connect.workspace = true
vellum-ink.workspace = true
# For `provider_for`/`host_of` on the ↗ badge: the same host table that names a card's site
# offline is what decides whether a card has an address a browser can open. Inherited from
# the workspace root, which declares it `default-features = false` -- so the `net` feature,
# and with it `ureq` and `ring`, is not in this build. `crates/vellum-web` must never fetch.
vellum-link.workspace = true
vellum-project.workspace = true
# The four pure layout crates behind the structured widgets. None of them does any I/O --
# a table's column widths, a chart's axis ticks, a kanban's lane packing and a tidy tree are
# all arithmetic over measured text -- so they cross to wasm untouched, the way the rest of
# the drawing stack did.
vellum-chart.workspace = true
vellum-flow.workspace = true
vellum-mindmap.workspace = true
vellum-table.workspace = true
serde.workspace = true
vellum-render.workspace = true
vellum-shapes.workspace = true
serde_json.workspace = true
# The inverted index and the fuzzy query, unchanged. Its only dependency is `thiserror` and
# every filesystem use is confined to the on-disk index, which a tab does not have — so the
# browser searches a board with the same code the desktop does rather than a smaller matcher.
vellum-search.workspace = true
vellum-scene.workspace = true
vellum-text.workspace = true
wgpu.workspace = true
log.workspace = true
futures-channel = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1"
web-time = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
  "Document", "Window", "Element", "HtmlCanvasElement", "HtmlElement",
  "Request", "RequestInit", "Response", "Performance", "Location",
  "WheelEvent", "PointerEvent", "DomRect", "CssStyleDeclaration",
  "Blob", "ImageBitmap", "OffscreenCanvas", "OffscreenCanvasRenderingContext2d", "ImageData",
  # The only thing that bounds a `fetch` that never settles. Feedback 44's lesson: bounding
  # only the awaits you have *observed* hang leaves the next one to hang instead.
  "AbortSignal",
  # `Window::navigator()` -> `sendBeacon`, the only fire-and-forget that survives a tab
  # being closed. It is how an unacknowledged edit gets one last chance to reach the server.
  "Navigator",
]
