[package]
name = "vellum-link"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Vellum's link cards: what a URL is called, and the OpenGraph/oEmbed metadata behind it. The parsing is pure and offline; the one fetching function is behind a feature-sized module so nothing else in the workspace gains a network dependency."

# `tl` is already in the tree for Miro's rich-text HTML, so parsing a page's `<head>`
# costs no new dependency. `ureq` is the only genuinely new one: blocking, rustls, no
# async runtime — the fetch happens on a worker thread, exactly as autosave does.
[dependencies]
log = { workspace = true }
thiserror = { workspace = true }
tl = { workspace = true }
ureq = { workspace = true, optional = true }

[features]
# `fetch` is the only thing in this crate that opens a socket, and it is the only
# thing that cannot exist in a browser: a wasm build reaches the network through
# the host page's own `fetch`, and `ureq` drags in rustls -> ring, whose build
# script does not run for wasm32 at all.
#
# On by default so every native caller is unchanged. `vellum-web` turns it off.
# `provider` and `meta` -- naming a site from its host, parsing OpenGraph -- are
# pure string work and stay available either way, which is what lets a card draw
# before any request finishes.
default = ["net"]
net = ["dep:ureq"]
