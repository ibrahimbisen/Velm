[package]
name = "vellum-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Velm's Agent Canvas layer: providers, transports, rules, notes and the inter-agent bus."

# A library plus two small binaries. The library is where all the logic lives and it
# depends on nothing in the workspace and nothing graphical, exactly as `vellum-doc`
# and `vellum-flow` do — so every rule, every cascade and every protocol frame is an
# ordinary unit test on a machine with no GPU and no display.
[lib]
name = "vellum_agent"
path = "src/lib.rs"

# The shim an agent process invokes to talk back to Velm: send a message along a
# connector, read or write a note, spawn a sub-agent, post an image. It is a separate
# binary because it runs inside *the agent's* process tree, not ours, and it must stay
# tiny — it is executed once per call.
[[bin]]
name = "velm-agent-cli"
path = "src/bin/velm_agent_cli.rs"

# Velm's own MCP server, so an agent that speaks MCP gets the same surface the shim
# offers without Velm having to be on its PATH.
[[bin]]
name = "velm-mcp"
path = "src/bin/velm_mcp.rs"

[dependencies]
anyhow.workspace = true
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true

# The one network dependency, and the same one the rest of the workspace uses:
# blocking, rustls-backed, driven from a worker thread that posts answers back through
# a channel. `reqwest` would bring `tokio` and a second execution model in exchange for
# concurrency a handful of agent turns does not need — the reasoning `vellum-link`
# already recorded, applied again rather than re-litigated.
ureq.workspace = true

# A real pseudo-terminal, for CLI agents that have no protocol mode. This is Maestri's
# mechanic: the agent believes it is talking to a terminal, so it emits the interactive
# output it would for a human, and one agent can type into another's session.
#
# `portable-pty` rather than raw `forkpty`: it is the same abstraction on macOS and
# Windows, which is the platform pair Velm ships on, and it does not drag in an async
# runtime.
portable-pty = "0.9"

# Reading what other people's formats keep compressed inside themselves.
#
# `flate2` is for PDF content streams, which are `FlateDecode`d in nearly every real
# document — without it the built-in extractor reads only the uncompressed minority and
# every other PDF falls back to "install pdftotext", which is a refusal the user cannot act
# on if they are on Windows.
#
# `zip` is for `.docx`, which is a ZIP of XML. The alternative on the table was shelling out
# to macOS's `textutil`, and that is not a cross-platform answer: it would mean Word
# documents work on the primary target and nowhere else, which is the kind of gap that gets
# discovered by the one user who is not on a Mac.
flate2.workspace = true
zip.workspace = true

# Microphone capture for push-to-talk, and the **only** optional dependency in this crate.
# `cpal` is the cross-platform audio abstraction on both platforms Velm ships on and drags in
# no async runtime — the same reasoning that chose `portable-pty` over raw `forkpty`.
cpal = { version = "0.18", optional = true }

[features]
# Push-to-talk microphone capture. **Off by default**, for three separate reasons, any one of
# which would be enough:
#
# - It is the only thing in the workspace that opens a recording device. A build that cannot
#   record cannot leak, and a microphone is the most private input in the application.
# - `docs/07-agent-canvas.md` §0 requires a board with no agent nodes to cost nothing.
# - On macOS `cpal` reaches `coreaudio-sys`, whose build script runs `bindgen` and therefore
#   needs libclang — a build-environment requirement no other crate in this workspace imposes.
#   Leaving it off by default means the ordinary build is unaffected by that, which matters on
#   a machine that has kernel-panicked twice during compilation.
#
# With the feature off, `voice::Unavailable` answers with a named, actionable message rather
# than the control silently doing nothing — nothing in this app is inert.
#
# Turning it on also needs `NSMicrophoneUsageDescription` in the bundle's `Info.plist`, or
# macOS kills the process at the first `start()`. Note that the bare `target/` binary and the
# signed bundle get *different* TCC records, so "works in dev, dies in the app" is a symptom
# of the plist and not of this code.
voice = ["dep:cpal"]

[dev-dependencies]
tempfile.workspace = true
