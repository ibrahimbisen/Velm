[package]
name = "vellum-project"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Turning a Velm document into a drawable scene: projection, connector routing, canvas palette."

# Extracted from `vellum-app` so a browser can reach it.
#
# These three modules were always pure -- `project.rs` names no application type at all, and
# `theme.rs`'s only mentions of the app are in comments -- but they lived inside a 60,000-line
# crate that pulls in winit, a clipboard, a native menu bar and SQLite. A wasm client needs
# exactly this layer and none of that.
#
# Moved rather than copied, and `vellum-app` re-exports the modules under their old paths, so
# the eight files that say `crate::project::` are unchanged and there is still **one**
# derivation of how a document becomes a scene. A second copy would drift within a week, and
# the failure would be silent: clicks landing where the paint is not.
[dependencies]
# The four structured widgets' own models, so `words` can read a token rather than a second
# copy of one. All four are pure geometry over serde and cross to wasm untouched, which is
# what makes this module reachable from the browser at all.
vellum-table.workspace = true
vellum-chart.workspace = true
vellum-mindmap.workspace = true
vellum-flow.workspace = true
# `export` turns a projection into the exporter's own document. It is here rather than in
# either front end because a board must export identically from both, and the adapter is
# where line breaks, auto-fit sizes and connector routes are decided — three things that
# would otherwise be two derivations able to disagree about what a board looks like on paper.
vellum-export.workspace = true
# `export` names a shape by the same string the SDF path does.
vellum-shapes.workspace = true
# `edit` walks graphemes and words. The caret's motion is the same on both front ends, and it
# is the one place in this crate that needs to know what a user considers "one character".
unicode-segmentation.workspace = true
serde.workspace = true
serde_json.workspace = true
# `theme` converts the chrome's accent choice and an agent's chat colourway into canvas
# colours, so it genuinely needs both vocabularies. Neither drags anything native in: both
# crates compile for wasm32, which is exactly what the feature split was for.
vellum-agent.workspace = true
vellum-connect.workspace = true
vellum-doc.workspace = true
vellum-render.workspace = true
vellum-scene.workspace = true
# `runs` converts the document's rich-text spans into the shaping engine's. Pure, and it
# lives here rather than in either front end because both need it and trap 10 — a bold span
# silently changing typeface — is a mistake nobody should have the chance to make twice.
vellum-text.workspace = true
vellum-ui.workspace = true
wgpu.workspace = true
