<!-- Velm mark — "Viewport", wearing the `xr-red` accent.
     One of the three accents Preferences ▸ Accent colour offers. Only the accented
     bracket changes; the other three stay `ink` #1A1D1F, because the mark's reading
     order is the accent and the rest is structure.
     `xr-red` #E65B58 is the light-mode coral. Note this is a *different value* from
     mark-dark.svg's #C8102E, which is the frozen dark cut rather than a filter.
     Grid 48x48, stroke 2.5, square caps, mitred joins. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <path d="M8 20V8h12" stroke="#E65B58" stroke-width="2.5" stroke-linecap="square"/>
  <path d="M28 8h12v12M40 28v12H28M20 40H8V28" stroke="#1A1D1F" stroke-width="2.5" stroke-linecap="square"/>
</svg>
