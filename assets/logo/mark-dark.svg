<!-- Dark-mode cut, retained and unreachable — the app ships light only.
     It is frozen at the original arrangement, where xr-red was the primary accent
     and deepened across the modes (#E65B58 -> #C8102E) so it held against a dark
     ground instead of glowing. The shipped light mark has since moved its accent to
     signal-teal; this one was deliberately not followed, because inventing a dark
     teal means maintaining a colour the user never gave for a cut nothing selects.
     Deliberately a separate file rather than a CSS filter: the two reds are
     different specifications, not one colour transformed. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <path d="M8 20V8h12" stroke="#C8102E" stroke-width="2.5" stroke-linecap="square"/>
  <path d="M28 8h12v12M40 28v12H28M20 40H8V28" stroke="#F5F5F6" stroke-width="2.5" stroke-linecap="square"/>
</svg>
